name: Prepare draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Versioned release tag matching config/release.json
        required: true
        default: v0.2.0
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("config/release.json")); const p=JSON.parse(fs.readFileSync("package.json")); if(r.tag!==process.env.RELEASE_TAG || "v"+p.version!==r.tag) throw new Error("Release tag/version mismatch");'
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run verify:release -- --local
      - name: Create a new draft with complete assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/check-release-tag.mjs
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "GoVisit Toolkit $RELEASE_TAG" --notes-file docs/release-notes.md
